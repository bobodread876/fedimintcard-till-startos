name: Build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86 }
          - { runner: ubuntu-24.04-arm, target: arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: Start9Labs/start-technologies/.github/actions/setup-build-env@master
      - run: npm ci
      - run: python3 -B scripts/test_pin_image.py
      - run: node --experimental-strip-types --test tests/*.mjs
      - run: npx --no-install tsc --noEmit
      - name: Build package for verification
        run: |
          start-cli init-key
          mkdir -p .startos
          cp ~/.startos/id.key.pem .startos/build.key.pem
          make ${{ matrix.target }}
